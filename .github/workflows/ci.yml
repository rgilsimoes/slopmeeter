name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest
      - name: Generate self-score
        run: slopmeter . --format markdown > docs/SELF_SCORE.md
      - name: Enforce evidence floor
        run: slopmeter . --fail-under 40
      - name: Publish self-score artifact
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-artifact@v4
        with:
          name: slopmeter-self-score
          path: docs/SELF_SCORE.md
