[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slop-meeter"
version = "0.1.0"
description = "Evidence-first repository assessment, without the vibes"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Slop Meeter contributors"}]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
slopmeter = "slopmeter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/slopmeter"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
